name: gym-system

# ------------------------------------------------------------------
#  Variante de PRODUCCION para Coolify (Servidor local / VPS).
#  Stack completo:
#   - App Web Express con motor de Cron nativo + soporte webhooks
#   - n8n (Motor visual de workflows y automatizaciones)
#   - Evolution API (WhatsApp Baileys)
#   - Postgres 16 (Bases: gym, n8n y evolution)
# ------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Lima}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-America/Lima}
      GYM_NAME: ${GYM_NAME:-Zona Fitness}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-gym}
      GYM_OWNER_PHONE: ${GYM_OWNER_PHONE:-}
      META_WA_TOKEN: ${META_WA_TOKEN:-}
      META_WA_PHONE_NUMBER_ID: ${META_WA_PHONE_NUMBER_ID:-}
      META_WA_WABA_ID: ${META_WA_WABA_ID:-}
      WHATSAPP_DEFAULT_PROVIDER: ${WHATSAPP_DEFAULT_PROVIDER:-meta}
      CULQI_PUBLIC_KEY: ${CULQI_PUBLIC_KEY:-}
      CULQI_SECRET_KEY: ${CULQI_SECRET_KEY:-}

    ports:
      - "8084:3000"
    expose:
      - "3000"
    volumes:
      - app_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    user: "root"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://100.117.103.36:5679/}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://n8n:5678/}
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: ${TZ:-America/Lima}
      TZ: ${TZ:-America/Lima}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-gym}
      GYM_OWNER_PHONE: ${GYM_OWNER_PHONE:-}
    ports:
      - "5679:5678"
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://100.117.103.36:8085}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DEL_INSTANCE: "false"
      LANGUAGE: es
      TZ: ${TZ:-America/Lima}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
    ports:
      - "8085:8080"
    expose:
      - "8080"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  n8n_data:
  evolution_instances:
  app_uploads:
